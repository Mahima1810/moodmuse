[project]
name = "moodmuse"
version = "0.1.0"
description = "Find the mood and the themes in written feedback: sentiment, clustering and summaries."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
